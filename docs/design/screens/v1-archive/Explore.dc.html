<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explore and search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#4fe061}a:hover{color:#7cf08a}
.yl-glass{background:rgba(255,255,255,.38);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 1px rgba(255,255,255,.35),0 6px 18px rgba(18,20,18,.18)}
.yl-scroll::-webkit-scrollbar,.yl-row::-webkit-scrollbar{display:none}
.yl-search::placeholder{color:#8b8a85}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121412; color: #f1efe9; font-family: Archivo, Arial, sans-serif;">
  <div class="yl-scroll" style="position: absolute; left: 0; right: 0; top: 0; bottom: 64px; overflow-y: auto; scrollbar-width: none;">

    <div style="padding: 20px 16px 0;">
      <sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
        <h1 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 1;">EXPLORE</h1>
      </sc-if>
      <sc-if value="{{isResults}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{goHome}}" style="padding: 0; background: transparent; border: 0; color: #c9c8c2; font: 600 13px Archivo, Arial, sans-serif; cursor: pointer;">‹ Explore</button>
        <h1 style="margin: 8px 0 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 1;">{{title}}</h1>
      </sc-if>
      <label style="margin-top: 16px; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #1c1f1c; border: 1px solid #3a3d39; border-radius: 10px;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b8a85" stroke-width="2.2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input class="yl-search" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Silver ring, bowl, wool hood…" aria-label="Search pieces" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #f1efe9; font: 400 15px Archivo, Arial, sans-serif;">
        <sc-if value="{{hasQ}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{clearQ}}" aria-label="Clear search" style="background: transparent; border: 0; color: #8b8a85; font-size: 16px; cursor: pointer;">✕</button></sc-if>
      </label>
    </div>

    <sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
      <nav aria-label="Categories" style="margin-top: 20px;">
        <sc-for list="{{catRows}}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{c.pick}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: transparent; border: 0; border-bottom: 1px solid #222421; color: #f1efe9; text-align: left; cursor: pointer;">
            <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: #1c1f1c; display: block;"><sc-if value="{{c.img}}" hint-placeholder-val="{{true}}"><img src="{{c.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: {{c.pos}};"></sc-if></span>
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px; font-weight: 600;">{{c.label}}</span><span style="font-size: 12px; color: #8b8a85;">{{c.count}}</span></span>
            <span aria-hidden="true" style="color: #8b8a85; font-size: 18px;">›</span>
          </button>
        </sc-for>
      </nav>
      <div style="margin-top: 24px; padding: 0 16px 32px; display: flex; flex-direction: column; gap: 10px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8b8a85;">POPULAR SEARCHES</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <sc-for list="{{popular}}" as="t" hint-placeholder-count="4">
            <button type="button" onClick="{{t.pick}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: #1c1f1c; color: #f1efe9; font: 500 13px Archivo, Arial, sans-serif; cursor: pointer;">{{t.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isResults}}" hint-placeholder-val="{{false}}">
      <sc-if value="{{hasSubs}}" hint-placeholder-val="{{false}}">
        <div class="yl-row" style="margin-top: 14px; display: flex; gap: 6px; overflow-x: auto; padding: 0 16px; scrollbar-width: none;">
          <sc-for list="{{subs}}" as="s" hint-placeholder-count="4">
            <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font: 600 13px Archivo, Arial, sans-serif; cursor: pointer;">{{s.label}}</button>
          </sc-for>
        </div>
      </sc-if>
      <div style="margin-top: 14px; padding: 0 16px; display: flex; gap: 8px;">
        <button type="button" onClick="{{openFilter}}" style="flex: 1; height: 44px; border-radius: 10px; border: 1.5px solid {{filterBorder}}; background: transparent; color: #f1efe9; font: 600 14px Archivo, Arial, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f1efe9" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>{{filterLabel}}</button>
        <button type="button" onClick="{{cycleSort}}" style="flex: 1; height: 44px; border-radius: 10px; border: 1.5px solid #3a3d39; background: transparent; color: #f1efe9; font: 600 14px Archivo, Arial, sans-serif; cursor: pointer;">{{sortLabel}} ▾</button>
      </div>
      <span style="display: block; padding: 14px 16px 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8b8a85;">{{pieceCount}}</span>

      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <div style="margin: 16px 16px 0; padding: 24px; border: 1px solid #2a2c2a; border-radius: 10px; display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 15px; font-weight: 600;">Nothing matches yet</span>
          <span style="font-size: 14px; color: #b9b8b2;">Try another word, or clear the filters.</span>
        </div>
      </sc-if>

      <div style="padding: 14px 16px 32px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 12px;">
        <sc-for list="{{pieces}}" as="p" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 4px; background: #1c1f1c;">
              <a href="#" style="display: block; width: 100%; height: 100%;"><img src="{{p.img}}" alt="{{p.name}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{p.pos}};"></a>
              <button type="button" aria-label="Save {{p.name}}" class="yl-glass" style="position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#121412" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
              <sc-if value="{{p.label}}" hint-placeholder-val="{{false}}">
                <span style="position: absolute; left: 8px; bottom: 8px; background: #121412; color: #f1efe9; padding: 4px 7px; border-radius: 2px; font-size: 10px; font-weight: 700; letter-spacing: 1.2px;">{{p.label}}</span>
              </sc-if>
            </div>
            <a href="#" style="display: flex; flex-direction: column; gap: 3px; text-decoration: none; color: #f1efe9;">
              <span style="font-size: 12px; color: #8b8a85;">{{p.maker}}</span>
              <span style="font-size: 14px; font-weight: 600;">{{p.name}}</span>
              <span style="margin-top: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 14px;">{{p.priceText}}</span>
            </a>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; border-top: 1px solid #222421; background: #121412; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; text-align: center; font-size: 12px; font-weight: 600;">
    <a href="#" style="color: #8b8a85; text-decoration: none;">Discover</a>
    <a href="#" aria-current="page" style="color: #f1efe9; text-decoration: none;">Explore</a>
    <a href="#" style="color: #8b8a85; text-decoration: none;">Following</a>
    <a href="#" style="color: #8b8a85; text-decoration: none;">Saved</a>
    <a href="#" style="color: #8b8a85; text-decoration: none;">Bag</a>
  </nav>

  <sc-if value="{{filterOpen}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-modal="true" aria-label="Filters" style="position: absolute; inset: 0; background: #121412; display: flex; flex-direction: column;">
      <div style="height: 60px; flex-shrink: 0; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222421;">
        <button type="button" onClick="{{closeFilter}}" aria-label="Close filters" style="width: 40px; height: 40px; margin-left: -8px; background: transparent; border: 0; color: #f1efe9; font-size: 20px; cursor: pointer;">✕</button>
        <span style="font-size: 16px; font-weight: 700;">Filter</span>
        <button type="button" onClick="{{clearAll}}" style="background: transparent; border: 0; color: #c9c8c2; font: 600 13px Archivo, Arial, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;">Clear all</button>
      </div>
      <div class="yl-scroll" style="flex-grow: 1; overflow-y: auto; scrollbar-width: none; padding: 8px 16px 24px;">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <fieldset style="margin: 0; padding: 18px 0; border: 0; border-bottom: 1px solid #222421;">
            <legend style="padding: 0; margin-bottom: 12px; font-size: 15px; font-weight: 700;">{{g.title}}</legend>
            <div style="display: flex; flex-direction: column;">
              <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
                <button type="button" role="checkbox" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0; background: transparent; border: 0; color: #f1efe9; font: 400 15px Archivo, Arial, sans-serif; cursor: pointer; text-align: left;">
                  <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid {{o.box}}; background: {{o.fill}}; display: flex; align-items: center; justify-content: center; color: #121412; font-size: 14px; font-weight: 700;">{{o.tick}}</span>
                  <span style="flex-grow: 1;">{{o.label}}</span>
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8b8a85;">{{o.n}}</span>
                </button>
              </sc-for>
            </div>
          </fieldset>
        </sc-for>
      </div>
      <div style="flex-shrink: 0; padding: 12px 16px 20px; border-top: 1px solid #222421;">
        <button type="button" onClick="{{closeFilter}}" style="width: 100%; height: 52px; border: 0; background: #4fe061; color: #121412; font: 700 13px Archivo, Arial, sans-serif; letter-spacing: 1.5px; cursor: pointer;">{{showLabel}}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startOn":{"editor":"enum","options":["home","results","filter"],"default":"home"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const start = props.startOn || 'home';
    this.state = { view: start === 'home' ? 'home' : 'results', cat: start === 'home' ? null : 'Jewellery', sub: 'All', q: '', flt: start === 'filter' ? ['silver'] : [], sort: 'new', filterOpen: start === 'filter' };
  }
  renderVals() {
    const st = this.state;
    const P = [
      { name: 'Flow ring', maker: 'Inez', cat: 'Jewellery', sub: 'Rings', mat: 'Silver', price: 145, st: 'order', img: '/_blob/42547c7d127c23e79e6298e385db6098', pos: 'center', label: 'HAND-CARVED WAX', n: 8 },
      { name: 'Ripple bowl', maker: 'Mara', cat: 'Ceramics', sub: 'Bowls', mat: 'Ceramic speckled', price: 78, st: 'ready', img: '/_blob/5bf0b89334514376f2638484cbb3bfb9', pos: 'center', label: 'SPECIAL WAX USED', n: 7 },
      { name: 'Granny square hood', maker: 'Ula', cat: 'Clothing', sub: 'Hoods', mat: 'Wool', price: 59, st: 'ready', img: '/_blob/ae6f6cd28159b01b44b5c7dbb20ae4ab', pos: 'center', label: '', n: 6 },
      { name: 'Twist vase', maker: 'Mara', cat: 'Ceramics', sub: 'Vases', mat: 'Ceramic terracotta', price: 120, st: 'ready', img: '/_blob/3e1c04a8e00317072d7077768622f3d8', pos: 'center', label: '1 OF 1', one: true, n: 5 },
      { name: 'Soft loop', maker: 'Inez', cat: 'Jewellery', sub: 'Rings', mat: 'Gold', price: 190, st: 'ready', img: '/_blob/8ece4143636c56a478f0d047aea99cba', pos: 'center', label: '', n: 4 },
      { name: 'Square scarf', maker: 'Ula', cat: 'Bags & accessories', sub: 'Scarves', mat: 'Wool', price: 45, st: 'order', img: '/_blob/22848ead2eed0958883df8dec0e50c06', pos: 'center', label: '', n: 3 },
      { name: 'Morning cup', maker: 'Mara', cat: 'Ceramics', sub: 'Cups', mat: 'Ceramic', price: 32, st: 'ready', img: '/_blob/c250021ba43e28825ae41415a4005f27', pos: 'center', label: '', n: 2 },
      { name: 'Fold ring', maker: 'Inez', cat: 'Jewellery', sub: 'Rings', mat: 'Silver', price: 160, st: 'order', img: '/_blob/f35d2b8d0907e4da528ee1b867ea5cf1', pos: 'center', label: '', n: 1 }
    ];
    const CATS = [
      ['Jewellery', '/_blob/3b1663da4f029616da26481c03aeb046', 'center', ['Rings', 'Necklaces', 'Earrings']],
      ['Ceramics', '/_blob/43cc8248789551a9e40281a0a78225c4', '25% center', ['Bowls', 'Cups', 'Vases']],
      ['Clothing', '/_blob/722923ff0d6196b11d37db1919181398', '70% 25%', ['Hoods', 'Knitwear']],
      ['Bags & accessories', '/_blob/2216899e48ec14b0f8f7b48f5e141546', 'center 30%', ['Scarves', 'Bags']],
      ['Home', '/_blob/e1d52bf47eb38f720bbf3ed250eb43f4', 'center', []],
      ['Art & prints', '', 'center', []]
    ];
    const has = (f) => st.flt.indexOf(f) > -1;
    const words = st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const match = (p, flt) => {
      const h = (x) => flt.indexOf(x) > -1;
      const hay = (p.name + ' ' + p.maker + ' ' + p.cat + ' ' + p.sub + ' ' + p.mat).toLowerCase();
      const mats = ['silver', 'gold', 'ceramic', 'wool'].filter(h);
      const prices = ['under', 'mid', 'high'].filter(h);
      return (!st.cat || p.cat === st.cat) && (st.sub === 'All' || p.sub === st.sub) &&
        words.every((w) => hay.indexOf(w) > -1) &&
        (!mats.length || mats.some((m) => p.mat.toLowerCase().indexOf(m) > -1)) &&
        (!prices.length || prices.some((r) => (r === 'under' && p.price < 50) || (r === 'mid' && p.price >= 50 && p.price <= 150) || (r === 'high' && p.price > 150))) &&
        (!h('ready') || p.st === 'ready') && (!h('order') || p.st === 'order') && (!h('one') || p.one);
    };
    const sort = st.sort;
    const pieces = P.filter((p) => match(p, st.flt))
      .sort((a, b) => sort === 'low' ? a.price - b.price : sort === 'high' ? b.price - a.price : b.n - a.n)
      .map((p) => ({ ...p, priceText: p.price + '€' }));
    const toggle = (id) => () => this.setState({ flt: has(id) ? st.flt.filter((x) => x !== id) : st.flt.concat([id]) });
    const opt = (id, label) => {
      const on = has(id);
      const n = P.filter((p) => match(p, on ? st.flt : st.flt.concat([id]))).length;
      return { label, on, pick: toggle(id), n, tick: on ? '✓' : '', box: on ? '#4fe061' : '#5a5d58', fill: on ? '#4fe061' : 'transparent' };
    };
    const groups = [
      { title: 'Material', opts: [opt('silver', 'Silver'), opt('gold', 'Gold'), opt('ceramic', 'Ceramic'), opt('wool', 'Wool')] },
      { title: 'Price', opts: [opt('under', 'Under 50€'), opt('mid', '50–150€'), opt('high', 'Over 150€')] },
      { title: 'Availability', opts: [opt('ready', 'Ready to ship'), opt('order', 'Made to order'), opt('one', '1 of 1 only')] }
    ];
    const catObj = CATS.find((c) => c[0] === st.cat);
    const subs = catObj && catObj[3].length ? ['All'].concat(catObj[3]).map((label) => {
      const on = st.sub === label;
      return { label, on, pick: () => this.setState({ sub: label }), bg: on ? '#f1efe9' : 'transparent', fg: on ? '#121412' : '#c9c8c2', border: on ? '#f1efe9' : '#3a3d39' };
    }) : [];
    const catRows = CATS.map(([label, img, pos]) => {
      const n = P.filter((p) => p.cat === label).length;
      return { label, img, pos, count: n ? n + ' pieces' : 'Coming soon', pick: () => this.setState({ view: 'results', cat: label, sub: 'All' }) };
    });
    const nf = st.flt.length;
    const sorts = { new: 'Newest', low: 'Price ↑', high: 'Price ↓' };
    return {
      isHome: st.view === 'home', isResults: st.view === 'results',
      title: st.q && !st.cat ? 'RESULTS' : (st.cat || 'ALL PIECES').toUpperCase(),
      goHome: () => this.setState({ view: 'home', cat: null, sub: 'All', q: '', flt: [] }),
      q: st.q, hasQ: !!st.q,
      onQ: (e) => this.setState({ q: e.target.value, view: e.target.value ? 'results' : st.view }),
      clearQ: () => this.setState({ q: '' }),
      catRows, popular: ['silver ring', 'speckled bowl', 'wool hood', 'gold'].map((label) => ({ label, pick: () => this.setState({ q: label, view: 'results', cat: null }) })),
      hasSubs: subs.length > 0, subs,
      filterLabel: nf ? 'Filter (' + nf + ')' : 'Filter', filterBorder: nf ? '#4fe061' : '#3a3d39',
      openFilter: () => this.setState({ filterOpen: true }), closeFilter: () => this.setState({ filterOpen: false }),
      clearAll: () => this.setState({ flt: [] }),
      filterOpen: st.filterOpen, groups,
      showLabel: 'SHOW ' + pieces.length + (pieces.length === 1 ? ' PIECE' : ' PIECES'),
      sortLabel: sorts[sort], cycleSort: () => this.setState({ sort: sort === 'new' ? 'low' : sort === 'low' ? 'high' : 'new' }),
      pieces, pieceCount: pieces.length + (pieces.length === 1 ? ' PIECE' : ' PIECES'), empty: pieces.length === 0
    };
  }
}
</script>
</body>
</html>
