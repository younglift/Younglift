<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Young Lift Discover</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: locked Young Lift design (white gallery, black pill buttons). Discover = one maker on a full-width stage; phone = story cards. */
:root{
  --ink:#141414; --grey:#6e6e73; --grey2:#4a4a4f; --white:#ffffff; --paper:#f3f2ee; --paper2:#f5f4f0;
  --line:#ecebe6; --line2:#d9d7d0; --lift:#4fe061; --amber:#e7a33b; --ok:#d9f7dc; --err:#c0392b;
  --display:Anton, Impact, "Arial Narrow", sans-serif; --body:Archivo, "Helvetica Neue", Arial, sans-serif;
  --meta:Geist, Archivo, "Helvetica Neue", Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--white);color:var(--ink);font-family:var(--body);font-size:15px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px))}
@media (max-width:820px){.wrap{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}}
.meta{font-family:var(--meta);color:var(--grey)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.anton{font-family:var(--display);font-weight:400;letter-spacing:.5px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font:500 13px/1 var(--meta);color:var(--grey);letter-spacing:2px;text-transform:uppercase}
.h1{font:600 32px/1.05 var(--body);letter-spacing:-1px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border:0;border-radius:999px;cursor:pointer;font:600 15px/1 var(--body);white-space:nowrap;text-decoration:none;transition:transform .12s, background .15s, box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;cursor:default}
.btn-dark{background:var(--ink);color:var(--white)}
.btn-dark:hover{background:#2a2a2a}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn-line:hover{background:var(--paper)}
.btn-line.on{background:var(--ink);color:var(--white)}
.btn-thin{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn-thin:hover{background:var(--paper2)}
.btn-soft{background:var(--paper);color:var(--ink)}
.btn-soft:hover{background:#e9e8e2}
.btn-white{background:var(--white);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--white);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8)}
.btn-lg{height:54px;padding:0 30px;font-size:16px}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.btn-block{width:100%}
.link{border:0;background:none;padding:0;cursor:pointer;font:600 14px/1 var(--body);text-decoration:underline;text-underline-offset:4px;color:var(--ink)}
.pill{height:36px;padding:0 16px;border:0;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);font:600 14px/1 var(--body);text-decoration:none;white-space:nowrap}
.pill:hover:not(.on){background:#e9e8e2}
.pill.on{background:var(--ink);color:var(--white)}
.circle{width:48px;height:48px;border:0;border-radius:999px;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:transform .12s, background .15s}
.circle:hover{transform:scale(1.05)}
.circle.on{background:var(--ink)}
.circle.white{background:var(--white)}
.circle.sm{width:36px;height:36px}
.chip{height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--paper);cursor:pointer;font:500 13px/1 var(--meta);white-space:nowrap;color:var(--ink)}
.chip:hover:not(.on){background:#e9e8e2}
.chip.on{background:var(--ink);color:var(--white)}
.follow-chip{height:30px;padding:0 12px;border:0;border-radius:999px;cursor:pointer;font:600 13px/1 var(--body);background:var(--ink);color:var(--white);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.follow-chip.on{background:var(--paper);color:var(--ink)}
.avatar{border-radius:999px;background:var(--paper) center/cover no-repeat;flex:0 0 auto;display:block}
.ph{position:relative;overflow:hidden;display:block;background:var(--paper2);max-width:100%}
.ph>img{width:100%;height:100%;object-fit:cover;display:block}

/* header (desktop) */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--white);box-shadow:inset 0 -1px 0 var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--white)}
.hdr-row{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{display:flex;align-items:center;gap:5px;font:400 24px/1 var(--display);letter-spacing:1px;color:var(--ink);text-decoration:none;flex:0 0 auto}
.logo b{font-weight:400;background:var(--lift);padding:3px 6px 0;border-radius:4px;transform:rotate(-6deg);display:inline-block}
.search{flex:1;min-width:120px;display:flex;align-items:center;gap:10px;height:46px;padding:0 5px 0 18px;border-radius:999px;background:var(--paper)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:400 15px/1 var(--meta);color:var(--ink);outline:none}
.search button{width:36px;height:36px;border:0;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.icon-btn{position:relative;width:44px;height:44px;border:0;border-radius:999px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex:0 0 auto}
.icon-btn:hover{background:var(--paper)}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--white);font:600 11px/18px var(--meta);text-align:center}
.me{width:36px;height:36px;border-radius:999px;background:#d9b7a6;display:block;flex:0 0 auto}
.interests-link{border:0;background:none;cursor:pointer;font:400 14px/1.2 var(--meta);color:var(--grey);text-align:left;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.interests-link:hover{color:var(--ink);text-decoration:underline}

/* phone chrome */
.topbar,.bottomnav{display:none}
@media (max-width:820px){
  .hdr{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;align-items:center;justify-content:space-between;background:var(--white);box-shadow:inset 0 -1px 0 var(--line);padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .topbar .logo{font-size:20px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);justify-content:space-around;align-items:center;background:var(--white);box-shadow:inset 0 1px 0 var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px/1 var(--body);color:var(--grey);text-decoration:none;padding:6px 10px;border-radius:12px;position:relative}
  .bottomnav a.on{color:var(--ink)}
  .bottomnav .badge{top:0;right:4px}
  #main{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}

/* welcome (step 2 A) */
.welcome{padding-block:48px 64px;display:flex;flex-direction:column;gap:32px}
.wl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.h-big{font:400 clamp(48px,7vw,72px)/.92 var(--display);letter-spacing:1px}
.lead{margin:0;font:400 19px/30px var(--meta);color:var(--grey);max-width:460px}
.igrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.igrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.itile{border:0;padding:0;background:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:12px;font:600 17px/1.1 var(--body);color:var(--ink)}
.itile .ph{aspect-ratio:16/10;border-radius:20px}
.itile.sel .ph{box-shadow:0 0 0 3px var(--ink)}
.itile .ph img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.itile:hover .ph img{transform:scale(1.03)}
.tick{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:999px;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.itile.sel .tick{background:var(--ink)}
.missing{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:500 13px/1.3 var(--meta);color:var(--grey);text-align:center;padding:12px;background:repeating-linear-gradient(135deg,var(--paper) 0 10px,var(--paper2) 10px 20px)}
.subrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* discover desktop (step 3 B, 5 B, 6 B) */
.disc{padding-block:24px 28px}
.stage{position:relative;height:clamp(520px, calc(100vh - 220px), 640px);border-radius:28px;overflow:hidden;background:var(--paper2)}
.col3{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:100%}
.col3>.ph{border-radius:20px;height:100%}
.col3>.ph:first-child{grid-row:span 2}
.spread{display:grid;grid-template-columns:1.15fr 1fr;height:100%;background:var(--white)}
.spread>.ph{height:100%;border-radius:24px}
.spread .txt{padding:36px 40px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.spread .txt>*{flex-shrink:0}
.spread h3{font:400 46px/.95 var(--display);letter-spacing:.5px}
.qa{display:flex;flex-direction:column;gap:12px;font:400 15px/1.5 var(--meta)}
.qa b{display:block;font:600 14px/1.3 var(--body);color:var(--grey)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;font:400 15px/1.45 var(--meta)}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:999px;background:var(--ink);color:var(--white);display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--body);flex:0 0 auto}
.spec{display:flex;justify-content:space-between;gap:16px;padding:10px 0;box-shadow:inset 0 -1px 0 var(--line);font:400 15px/1.3 var(--meta)}
.spec span:first-child{color:var(--grey)}
.mini{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:14px;box-shadow:inset 0 1px 0 var(--line);flex-wrap:wrap}
.novideo{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:32px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--white);font:500 12px/1.3 var(--meta)}
.novideo i{width:8px;height:8px;border-radius:9px;background:#b8b6b0;flex:0 0 auto}
.slidechip{position:absolute;left:20px;top:20px;z-index:4;height:30px;padding:0 12px;display:flex;align-items:center;border-radius:999px;background:var(--white);font:600 12px/1 var(--body)}
.arrows{position:absolute;top:50%;left:20px;right:20px;margin-top:-24px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.arrows .circle{pointer-events:auto;background:var(--white);box-shadow:0 0 0 1px var(--line2)}
.tagtoggle{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:5;height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--white);display:flex;align-items:center;gap:8px;cursor:pointer;font:600 12px/1 var(--body)}
.glass{position:absolute;left:24px;bottom:24px;z-index:5;width:540px;max-width:calc(100% - 48px);padding:20px;border-radius:24px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.65),0 10px 30px -12px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.glass .who{display:flex;align-items:center;gap:14px}
.glass .meta{color:var(--grey2)}
.glass .circle{background:rgba(255,255,255,.4)}
.glass .circle.on{background:var(--ink)}
.glass .follow-chip.on{background:rgba(255,255,255,.7)}
.pieces-btn{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;border-radius:18px;background:rgba(255,255,255,.35);border:0;cursor:pointer;text-align:left;color:var(--ink)}
.pieces-btn .stack{display:flex}
.pieces-btn .stack img{width:36px;height:36px;border-radius:10px;object-fit:cover;box-shadow:0 0 0 2px var(--paper2);margin-left:-10px}
.pieces-btn .stack img:first-child{margin-left:0}
.dotsbar{position:absolute;right:24px;bottom:24px;z-index:5;display:flex;gap:6px;align-items:center;padding:10px 12px;border-radius:999px;background:var(--white)}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:8px;height:8px;padding:0;border:0;border-radius:999px;background:var(--line2);cursor:pointer;transition:width .2s}
.dots button.on{width:24px;background:var(--ink)}
.tag{position:absolute;z-index:3;transform:translate(-7px,-7px);display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer}
.tag .dot{width:14px;height:14px;border-radius:999px;background:var(--white);box-shadow:0 0 0 4px rgba(255,255,255,.45),0 1px 4px rgba(0,0,0,.25);flex:0 0 auto}
.tag .bub{height:34px;padding:0 12px 0 14px;display:flex;align-items:center;gap:8px;border-radius:999px;background:var(--white);box-shadow:0 4px 14px -6px rgba(0,0,0,.35);font:600 13px/1 var(--body);color:var(--ink);white-space:nowrap;transition:transform .15s}
.tag .bub .pr{font:600 12px/1 var(--mono)}
.tag .bub .go{flex:0 0 auto;width:20px;height:20px;border-radius:999px;background:var(--ink);color:var(--white);display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--body)}
.tag:hover .bub,.tag.on .bub{transform:translateY(-2px)}
.tag.on .bub{background:var(--ink);color:var(--white)}
.tag.on .bub .go{background:var(--lift);color:var(--ink)}
.tag.flip{flex-direction:row-reverse;transform:translate(calc(-100% + 7px),-7px)}
.qb{position:absolute;right:24px;top:64px;z-index:7;width:310px;padding:16px;border-radius:24px;background:var(--white);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}
.qb .x{position:absolute;right:10px;top:10px}
.qb.sheet{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;z-index:52;border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sizes button{height:36px;min-width:46px;padding:0 10px;border:0;border-radius:999px;background:var(--paper);cursor:pointer;font:600 13px/1 var(--body)}
.sizes button.on{background:var(--ink);color:var(--white)}
.uprow{display:flex;gap:12px;align-items:center;padding-top:18px;flex-wrap:wrap;position:relative;z-index:6}
.uprow .who-pill{border:0;background:var(--paper2);border-radius:999px;padding:6px 16px 6px 6px;display:flex;align-items:center;gap:10px;cursor:pointer;font:600 14px/1 var(--body);color:var(--ink)}
.uprow .who-pill.on{background:var(--ink);color:var(--white)}
.mk-out-up{animation:mkOutUp .2s ease-in forwards}.mk-out-down{animation:mkOutDown .2s ease-in forwards}
.mk-in-up{animation:mkInUp .42s cubic-bezier(.2,.8,.2,1)}.mk-in-down{animation:mkInDown .42s cubic-bezier(.2,.8,.2,1)}
@keyframes mkOutUp{to{transform:translateY(-70px) scale(.97);opacity:0}}@keyframes mkOutDown{to{transform:translateY(70px) scale(.97);opacity:0}}
@keyframes mkInUp{from{transform:translateY(110px) scale(.97);opacity:0}}@keyframes mkInDown{from{transform:translateY(-110px) scale(.97);opacity:0}}
@media (prefers-reduced-motion:reduce){.mk-out-up,.mk-out-down,.mk-in-up,.mk-in-down{animation:none}}
.endstate{padding:56px 24px;border-radius:28px;background:var(--paper2);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

/* discover phone (step 4 A) */
.pfeed{display:none}
@media (max-width:820px){
  .disc{display:none}
  .pfeed{display:flex;flex-direction:column;gap:10px;height:calc(100vh - 56px - 64px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - 56px - 64px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;background:var(--paper);padding:8px;scroll-padding:8px;scrollbar-width:none}
  #main.is-feed{padding-bottom:0}
}
.pfeed::-webkit-scrollbar,.track::-webkit-scrollbar{display:none}
.pcard{flex:0 0 auto;height:100%;border-radius:26px;overflow:hidden;position:relative;background:var(--ink);scroll-snap-align:start;scroll-snap-stop:always}
.track{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pslide{flex:0 0 100%;scroll-snap-align:start;position:relative;overflow:hidden}
.pslide>img{width:100%;height:100%;object-fit:cover;display:block}
.pcol{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.7fr 1fr;gap:6px;height:100%}
.pcol span{position:relative;overflow:hidden}
.pcol span img{width:100%;height:100%;object-fit:cover;display:block}
.pcol span:first-child{grid-column:span 2}
.prog{position:absolute;left:12px;right:12px;top:10px;z-index:4;display:flex;gap:4px}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}
.prog i.on{background:var(--white)}
.pchip{position:absolute;left:12px;top:22px;z-index:3;height:28px;padding:0 10px;display:flex;align-items:center;border-radius:999px;background:var(--white);font:600 11px/1 var(--body)}
.pcap{position:absolute;left:12px;right:12px;top:58px;z-index:3;padding:10px 12px;border-radius:14px;background:var(--white);font:400 13px/1.4 var(--meta)}
.pcap b{display:block;font:600 13px/1.3 var(--body);margin-bottom:2px}
.shade{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(transparent,rgba(20,20,20,.85));z-index:2;pointer-events:none}
.pinfo{position:absolute;left:16px;right:16px;bottom:16px;z-index:4;color:var(--white);display:flex;flex-direction:column;gap:12px}
.pinfo .dots button{background:rgba(255,255,255,.5)}
.pinfo .dots button.on{background:var(--white)}
.pcard .tag .bub{height:30px;font-size:12px}
.pend{flex:0 0 auto;height:100%;border-radius:26px;background:var(--white);scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.hint{position:fixed;left:16px;right:16px;top:calc(68px + env(safe-area-inset-top,0px));z-index:25;padding:14px 16px;border-radius:18px;background:var(--ink);color:var(--white);font:500 14px/1.4 var(--meta);display:none;gap:12px;align-items:flex-start}
@media (max-width:820px){.hint.show{display:flex}}
.hint button{margin-left:auto;border:0;background:var(--white);color:var(--ink);border-radius:999px;height:30px;padding:0 12px;font:600 12px/1 var(--body);cursor:pointer;flex:0 0 auto}

/* maker profile (7 B + 8 B) */
.cover{display:grid;grid-template-columns:420px 1fr;gap:40px;padding-block:24px}
.cover .portrait{height:520px;border-radius:28px}
.cover .txt{display:flex;flex-direction:column;gap:18px;padding-top:8px;min-width:0}
.cover h1{font:400 clamp(56px,8vw,92px)/.9 var(--display);letter-spacing:1px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--paper);font:500 13px/1 var(--meta)}
.fact.green i{width:8px;height:8px;border-radius:9px;background:var(--lift)}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:auto}
.strip>*{aspect-ratio:4/3;border-radius:18px}
.vtile{position:relative;overflow:hidden;border-radius:18px;background:var(--paper2)}
.vtile>img,.vtile>video{width:100%;height:100%;object-fit:cover;display:block}
.vtile .lbl{position:absolute;left:10px;right:10px;bottom:10px;padding:8px 10px;border-radius:12px;background:var(--white);font:500 12px/1.3 var(--meta)}
.vtile .lbl b{display:block;font:600 13px/1.2 var(--body)}

  if(key==='meet'){var vid=(m.id==='inez'&&ui.video)?'<video src="'+ui.video+'" controls muted playsinline style="width:100%;height:100%;object-fit:cover"></video>':'<img src="'+(m.portrait||IMG(m.meet.img))+'" alt="'+esc(m.name)+'" style="object-position:'+m.meet.pos+'">';
    return '<div class="spread"><span class="ph">'+vid+'</span><div class="txt"><h3>MEET '+esc(m.name).toUpperCase()+'</h3><div class="qa">'+m.meet.qa.map(function(q){return '<div><b>'+esc(q[0])+'</b>'+esc(q[1])+'</div>';}).join('')+'</div>'+((m.id==='inez'&&ui.video)?'':novideo())+mini(m)+'</div></div>';}

}

  else if(key==='meet'){inner=(m.id==='inez'&&ui.video)?'<video src="'+ui.video+'" controls muted playsinline style="width:100%;height:100%;object-fit:cover"></video>':'<img src="'+(m.portrait||IMG(m.meet.img))+'" alt="'+esc(m.name)+'" style="object-position:'+m.meet.pos+'">';cap='<div class="pcap"><b>“'+esc(m.meet.qa[1][1])+'”</b>'+((m.id==='inez'&&ui.video)?'':'Intro video not filmed yet · demo shows a photo')+'</div>';}
  else if(key==='process'){inner='<img src="'+IMG(m.process.img)+'" alt="'+esc(m.process.title)+'">';cap='<div class="pcap"><b>'+esc(m.process.title.charAt(0)+m.process.title.slice(1).toLowerCase())+'</b>'+esc(m.process.steps[0])+'</div>';}
  else {var p=PRODUCTS[m.closer];inner='<img src="'+IMG(p.img)+'" alt="'+esc(p.name)+'" style="object-position:'+p.pos+'">'+tagsHtml([[40,32,p.id]],'phone');}
  return '<div class="pslide" aria-label="'+(si+1)+' of '+seq.length+'">'+inner+'<span class="pchip">'+(si+1)+'/'+seq.length+' · '+(key==='meet'?'Meet '+esc(m.name):SLIDE_NAMES[key])+'</span>'+cap+'</div>';}).join('');}
function vDiscoverPhone(q){
  var cards=q.map(function(id,ci){var m=MAKERS[id],seq=seqOf(m),fo=isFollow(id),sv=isSavedM(id);
    return '<section class="pcard" data-ci="'+ci+'"><div class="track" data-track="'+ci+'">'+pslides(m)+'</div><div class="prog" data-prog="'+ci+'">'+seq.map(function(x,i){return '<i class="'+(i?'':'on')+'"></i>';}).join('')+'</div><div class="shade"></div>'+
     '<div class="pinfo"><div style="display:flex;align-items:center;gap:10px">'+av(m,40)+'<div><div style="font:600 18px/1.1 var(--body)">'+esc(m.name)+'</div><div style="font:400 13px/1.2 var(--meta);margin-top:3px;color:rgba(255,255,255,.75)">'+esc(m.city)+' · '+esc(m.craft)+'</div></div></div><div style="font:400 15px/1.4 var(--meta)">“'+esc(m.quote)+'”</div>'+
     '<div style="display:flex;gap:8px;align-items:center"><a class="btn btn-white" style="flex:1;height:44px" href="#maker-'+id+'" data-act="to-maker" data-id="'+id+'">Meet '+esc(m.name)+'</a><button class="btn btn-ghost" style="height:44px" data-act="follow" data-id="'+id+'" aria-pressed="'+fo+'">'+(fo?'Following':'Follow')+'</button><button class="circle'+(sv?' on':'')+'" style="width:44px;height:44px;'+(sv?'':'background:rgba(255,255,255,.18)')+'" data-act="save-maker" data-id="'+id+'" aria-pressed="'+sv+'" aria-label="Save '+esc(m.name)+'">'+I.heart(sv,'#fff')+'</button></div>'+
     '<div style="display:flex;justify-content:space-between;align-items:center"><div class="dots" data-dots="'+ci+'">'+seq.map(function(k,i){return '<button class="'+(i?'':'on')+'" data-act="pslide" data-ci="'+ci+'" data-v="'+i+'" aria-label="'+SLIDE_NAMES[k]+'"></button>';}).join('')+'</div><span style="font:500 12px/1 var(--meta);color:rgba(255,255,255,.75)">Maker '+(ci+1)+' of '+q.length+' · swipe up</span></div></div></section>';}).join('');
  return '<div class="pfeed" data-pfeed="1">'+cards+'<section class="pend"><span class="anton" style="font-size:34px;line-height:1">YOU’VE MET EVERYONE HERE</span><span class="meta" style="font-size:14px">That’s every maker in '+esc(interestLabel())+' for now.</span><button class="btn btn-dark" data-act="edit-interests">Add more interests</button><a class="btn btn-line" href="#saved">See saved makers</a></section></div>';
}
function vDiscover(){
  if(!S.interests&&!S.surprise){location.replace('#welcome');return '';}
  var q=queue();if(ui.fi>q.length)ui.fi=0;
  return shell('discover',vDiscoverDesk(q)+vDiscoverPhone(q),{feed:true,noFooter:true})+(S.hint?'<div class="hint show" id="hint"><span><b style="display:block;font-weight:600;margin-bottom:2px">How it works</b>Swipe across to meet the maker. Swipe up to discover someone new.</span><button data-act="hint">Got it</button></div>':'');

/* ================= ROUTER ================= */
var last='',feedScroll=null;
function render(){
  var h=(location.hash||'').slice(1);
  if(!h) h=(S.interests||S.surprise)?'discover':'welcome';
  var html;
  if(h!==last){ui.menu=null;ui.naming=false;ui.qb=null;if(h.indexOf('maker-')===0&&last.indexOf('maker-')!==0){if(!ui.keepTab){ui.mtab='Pieces';ui.pfilter='All';}ui.keepTab=false;} if(h==='welcome'){ui.sel=null;ui.subSel=null;}}
  if(h==='welcome') html=vWelcome();
  else if(h==='discover') html=vDiscover();
  else if(h.indexOf('maker-')===0) html=vMaker(h.slice(6));
  else if(h==='saved') html=vSaved();
  else if(h==='following') html=vFollowing();
  else if(h==='messages') html=vMessages();
  else if(h==='profile') html=vProfile();
  else if(h==='studio') html=vStudio();
  else if(h==='search') html=vSearch();
  else if(h==='help') html=vHelp();
  else html=vMissing();
  if(!html) return;
  document.getElementById('app').innerHTML=html;
  if(h!==last) window.scrollTo(0,0);
  last=h;
  drawLayer();
  bindFeed();
}
function drawLayer(){var l=document.getElementById('layer'),html='';
  if(ui.ov&&ui.ov.type==='product') html+=vProductWin();
  if(ui.ov&&ui.ov.type==='msg') html+=vMsgWin();
  if(ui.bag) html+=vBag();
  if(ui.qb&&!ui.ov&&!ui.bag&&window.innerWidth<=820) html+='<div class="scrim" data-act="qb-close"></div>'+quickBuy(true)+'';
  l.innerHTML=html;
  var b=document.getElementById('bubbles');if(b)b.scrollTop=b.scrollHeight;
  document.body.style.overflow=(ui.ov||ui.bag||(ui.qb&&window.innerWidth<=820))?'hidden':'';
}
var mkLock=false;
function goMaker(to){var q=queue();if(mkLock||to<0||to>q.length||to===ui.fi)return;var dir=to>ui.fi?1:-1,st=document.querySelector('.disc .stage,.disc .endstate');mkLock=true;
  var done=function(){ui.fi=to;ui.slide=0;ui.qb=null;rerender();window.scrollTo(0,0);var n=document.querySelector('.disc .stage,.disc .endstate');if(n)n.classList.add(dir>0?'mk-in-up':'mk-in-down');setTimeout(function(){mkLock=false;},420);};
  if(st&&window.innerWidth>820&&!matchMedia('(prefers-reduced-motion: reduce)').matches){st.classList.add(dir>0?'mk-out-up':'mk-out-down');setTimeout(done,190);}else done();}
(function(){var acc=0,last=0,quiet=0,qt=null;
  window.addEventListener('wheel',function(e){if(location.hash!=='#discover'||ui.ov||ui.bag||window.innerWidth<=820)return;
    var ax=Math.abs(e.deltaX),ay=Math.abs(e.deltaY),horiz=ax>ay;
    if(!horiz){var de=document.documentElement,canScroll=de.scrollHeight>window.innerHeight+40;
      if(canScroll&&((e.deltaY>0&&window.scrollY+window.innerHeight<de.scrollHeight-2)||(e.deltaY<0&&window.scrollY>0)))return;}
    e.preventDefault();var now=Date.now();
    if(quiet){clearTimeout(qt);qt=setTimeout(function(){quiet=0;},220);return;}
    if(now-last>250)acc=0;last=now;acc+=horiz?e.deltaX:e.deltaY;
    if(Math.abs(acc)<45)return;var d=acc>0?1:-1;acc=0;quiet=1;qt=setTimeout(function(){quiet=0;},700);
    if(horiz){var q=queue();if(ui.fi>=q.length)return;var n=seqOf(MAKERS[q[ui.fi]]).length;ui.slide=(ui.slide+d+n)%n;ui.qb=null;rerender();}
    else goMaker(ui.fi+d);},{passive:false});})();
function rerender(){var y=window.scrollY,ae=document.activeElement,aid=ae&&ae.id;keepFeed();render();window.scrollTo(0,y);restoreFeed();if(aid){var el=document.getElementById(aid);if(el&&el!==document.body){el.focus();try{if(el.setSelectionRange&&/text|search|textarea/.test(el.type||el.tagName.toLowerCase())){var n=el.value.length;el.setSelectionRange(n,n);}}catch(e){}}}}
function keepFeed(){var f=document.querySelector('[data-pfeed]');if(!f)return;feedScroll={top:f.scrollTop,tracks:{}};document.querySelectorAll('[data-track]').forEach(function(t){feedScroll.tracks[t.dataset.track]=t.scrollLeft;});}
function restoreFeed(){var f=document.querySelector('[data-pfeed]');if(!f||!feedScroll)return;f.scrollTop=feedScroll.top;Object.keys(feedScroll.tracks).forEach(function(k){var t=document.querySelector('[data-track="'+k+'"]');if(t)t.scrollLeft=feedScroll.tracks[k];});feedScroll=null;}
function bindFeed(){var f=document.querySelector('[data-pfeed]');if(!f)return;
  if(f.clientHeight&&ui.fi&&!f._init){f.scrollTop=ui.fi*(f.clientHeight-6);}
  f._init=true;
  f.addEventListener('scroll',function(){var c=f.querySelector('.pcard');if(!c)return;ui.fi=Math.round(f.scrollTop/(c.offsetHeight+10));},{passive:true});
  document.querySelectorAll('[data-track]').forEach(function(tr){tr.addEventListener('scroll',function(){var i=Math.round(tr.scrollLeft/tr.clientWidth),id=tr.dataset.track;var d=document.querySelector('[data-dots="'+id+'"]');if(d)[].forEach.call(d.children,function(b,j){b.classList.toggle('on',j===i);});var p=document.querySelector('[data-prog="'+id+'"]');if(p)[].forEach.call(p.children,function(b,j){b.classList.toggle('on',j<=i);});if(String(ui.fi)===id)ui.slide=i;},{passive:true});
    if(String(ui.fi)===tr.dataset.track&&ui.slide&&!feedScroll){tr.scrollLeft=ui.slide*tr.clientWidth;}});
}

function addToBag(id,size){var p=PRODUCTS[id];if(!p||p.st==='sold')return false;size=p.size?size:'';var b=S.bag.filter(function(x){return x[0]===id&&x[1]===size;})[0];if(b)b[2]++;else S.bag.push([id,size,1]);save();return true;}
function curSize(p){if(!p.size)return '';var opts=p.size==='ring'?['50','52','54','56','58']:['S/M','M/L'];return opts.indexOf(ui.qbSize)>-1?ui.qbSize:opts[p.size==='ring'?2:0];}

function sendMsg(mid,txt,qi){txt=String(txt).trim();if(!txt)return;var list=S.msgs[mid]=S.msgs[mid]||[];if(ui.ov&&ui.ov.pid&&!ui.ov.ctxAdded){list.push([2,ui.ov.pid]);ui.ov.ctxAdded=true;}list.push([1,txt]);save();drawLayer();
  setTimeout(function(){list.push([0,qi!=null?REPLY[qi]:'Thanks for writing! I’ll look at this and come back to you soon.']);save();if(ui.ov&&ui.ov.type==='msg'&&ui.ov.id===mid&&ui.ov.tab==='msg')drawLayer();},1100);
  var d=document.getElementById('draft');if(d)d.focus();}
function openMaker(id,tab){ui.qb=null;ui.ov=null;ui.bag=false;if(tab){ui.mtab=tab;ui.keepTab=true;}if(location.hash==='#maker-'+id)rerender();else location.hash='maker-'+id;}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;

   case 'slide':{var q=queue(),m=MAKERS[q[ui.fi]],n=seqOf(m).length;ui.slide=(ui.slide+parseInt(v,10)+n)%n;ui.qb=null;rerender();break;}

   case 'next-maker':if(window.innerWidth>820)goMaker(ui.fi+1);else{ui.fi++;ui.slide=0;ui.qb=null;rerender();window.scrollTo(0,0);}break;
   case 'pick-maker':goMaker(parseInt(v,10));break;
   case 'restart':goMaker(0);break;
   case 'toggle-tags':ui.tags=!ui.tags;ui.qb=null;rerender();break;
   case 'tag':{e.preventDefault();ui.qb=(ui.qb===id)?null:id;var tp=PRODUCTS[id];if(tp&&tp.size){var to=tp.size==='ring'?['50','52','54','56','58']:['S/M','M/L'];if(to.indexOf(ui.qbSize)<0)ui.qbSize=to[tp.size==='ring'?2:0];}rerender();break;}
   case 'qb-close':ui.qb=null;rerender();break;
   case 'size':ui.qbSize=v;rerender();break;
   case 'buy-now':{var p=PRODUCTS[id];addToBag(id,curSize(p));ui.qb=null;ui.done=null;ui.bag=true;rerender();break;}
   case 'add-quick':{var p2=PRODUCTS[id];if(addToBag(id,curSize(p2))){ui.qb=null;rerender();toast(esc(p2.name)+(p2.size?', size '+curSize(p2):'')+' added to bag','View bag','open-bag');}break;}

   case 'hint':S.hint=false;save();var hn=document.getElementById('hint');if(hn)hn.remove();break;
   case 'to-maker':e.preventDefault();openMaker(id);break;
   case 'to-pieces':openMaker(id,'Pieces');break;
   case 'back-feed':e.preventDefault();location.hash='discover';break;
   /* follow / save */
   case 'follow':{var fi=S.follow.indexOf(id);if(fi>-1){S.follow.splice(fi,1);toast('Unfollowed '+esc(MAKERS[id].name));}else{S.follow.push(id);toast('Following '+esc(MAKERS[id].name)+' · new pieces show first');}save();rerender();if(ui.ov)drawLayer();break;}
   case 'save-maker':{var si=S.savedMakers.indexOf(id);if(si>-1){S.savedMakers.splice(si,1);toast('Removed '+esc(MAKERS[id].name)+' from Saved');}else{S.savedMakers.push(id);toast(esc(MAKERS[id].name)+' saved','See Saved','go-saved');}save();rerender();break;}
   case 'save-piece':{var pi=S.savedPieces.indexOf(id);if(pi>-1){S.savedPieces.splice(pi,1);Object.keys(S.colls).forEach(function(c){S.colls[c]=S.colls[c].filter(function(x){return x!==id;});});toast('Removed from Saved');}else{S.savedPieces.push(id);toast(esc(PRODUCTS[id].name)+' saved','See Saved','go-saved');}save();rerender();if(ui.ov)drawLayer();break;}
   case 'go-saved':ui.ov=null;ui.bag=false;location.hash='saved';break;

   case 'pfilter':ui.pfilter=v;rerender();break;
   /* product window */
   case 'open-product':e.preventDefault();ui.qb=null;ui.bag=false;ui.ov={type:'product',id:id,img:0};var pp=PRODUCTS[id];if(pp&&pp.size){var o2=pp.size==='ring'?['50','52','54','56','58']:['S/M','M/L'];if(o2.indexOf(ui.qbSize)<0)ui.qbSize=o2[pp.size==='ring'?2:0];}if(document.querySelector('.qb'))rerender();drawLayer();break;
   case 'pimg':ui.ov.img=parseInt(v,10);drawLayer();break;

   case 'remove':S.bag=S.bag.filter(function(x){return !(x[0]===id&&x[1]===(el.dataset.size||''));});save();drawLayer();rerender();toast('Removed from bag');break;

  if(e.key==='Escape'){if(ui.qb){ui.qb=null;rerender();}else if(ui.ov){ui.ov=null;drawLayer();rerender();}else if(ui.bag){ui.bag=false;drawLayer();}return;}
  var t=e.target;if(t&&/input|textarea|select/i.test(t.tagName))return;
  if(t&&t.matches&&t.matches('[role=button]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click();return;}
  if(location.hash==='#discover'&&!ui.ov&&!ui.bag&&window.innerWidth>820){var q=queue();if(e.key==='ArrowDown'){e.preventDefault();goMaker(ui.fi+1);return;}if(e.key==='ArrowUp'){e.preventDefault();goMaker(ui.fi-1);return;}if(!q.length||ui.fi>=q.length)return;var m=MAKERS[q[ui.fi]],n=seqOf(m).length;
    if(e.key==='ArrowRight'){ui.slide=(ui.slide+1)%n;ui.qb=null;rerender();}else if(e.key==='ArrowLeft'){ui.slide=(ui.slide-1+n)%n;ui.qb=null;rerender();}else if(e.key==='ArrowDown'){e.preventDefault();ui.fi++;ui.slide=0;ui.qb=null;rerender();}else if(e.key==='ArrowUp'&&ui.fi>0){e.preventDefault();ui.fi--;ui.slide=0;ui.qb=null;rerender();}}
});
document.addEventListener('submit',function(e){var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();var t=f.dataset.form;
  if(t==='search'){ui.q=document.getElementById('q').value;if(location.hash==='#search')rerender();else location.hash='search';}
  else if(t==='news'){toast('Subscribed. New makers land in your inbox.');f.reset();}
  else if(t==='send'){var inp=document.getElementById('draft');var txt=inp.value;inp.value='';sendMsg(f.dataset.id,txt);}
  else if(t==='custom'){var mid=f.dataset.id,c=ui.custom[mid];var d=document.getElementById('c-desc').value.trim();c.desc=d;if(!d){document.getElementById('f-desc').classList.add('err');toast('Describe what you’d like first');return;}c.time=document.getElementById('c-time').value;c.sent=true;var list=S.msgs[mid]=S.msgs[mid]||[];if(ui.ov.pid&&!ui.ov.ctxAdded){list.push([2,ui.ov.pid]);ui.ov.ctxAdded=true;}list.push([1,'Custom request: '+d+' · '+BUD[c.bud]+' · '+c.time+(c.ref?' · reference photo attached':'')]);save();drawLayer();
    setTimeout(function(){list.push([0,'Thank you, this sounds lovely. A couple of questions before I quote: '+(MAKERS[mid].id==='inez'?'which size, and silver or gold?':MAKERS[mid].id==='mara'?'how many pieces, and which colour?':'which colours, and which size?')]);save();if(ui.ov&&ui.ov.type==='msg'&&ui.ov.tab==='msg')drawLayer();},1300);}
  else if(t==='newcoll'){var nm=document.getElementById('newc').value.trim();if(nm){if(S.colls[nm]){toast('You already have “'+esc(nm)+'”');return;}S.colls[nm]=[];ui.coll=nm;save();toast('Collection “'+esc(nm)+'” created');}ui.naming=false;rerender();}
  else if(t==='addpiece'){var pn=document.getElementById('pn').value.trim(),pr=parseFloat(String(document.getElementById('pp').value).replace(',','.'));var bad=false;if(!pn){document.getElementById('f-pn').classList.add('err');bad=true;}if(isNaN(pr)||pr<=0){document.getElementById('f-pp').classList.add('err');bad=true;}if(bad){toast('Add a name and a price');return;}
    var nid='mine'+Date.now();var np={id:nid,maker:'inez',name:pn,mat:'Recycled silver',price:pr,img:'fold-ring',pos:'30% 60%',st:'order',size:'ring',specs:[['Material','Recycled sterling silver'],['Made','To order']]};S.studio.extra.push(np);if(S.published)PRODUCTS[nid]=np;save();rerender();toast(esc(pn)+' added'+(S.published?'':' · goes live when you publish'));}
});
document.addEventListener('input',function(e){var el=e.target;
  if(el.dataset.sf){S.studio[el.dataset.sf]=el.value;save();var pv=document.querySelector('.sright');if(pv)pv.innerHTML=studioPreview();return;}
  if(el.dataset.cdesc){ui.custom[el.dataset.cdesc].desc=el.value;var fd=document.getElementById('f-desc');if(fd)fd.classList.remove('err');return;}
  if(el.id==='pn'||el.id==='pp'){var box=el.closest('.inp');if(box)box.classList.remove('err');}
});
document.addEventListener('change',function(e){var el=e.target;
  if(el.dataset.ctime){ui.custom[el.dataset.ctime].time=el.value;}
  if(el.dataset.cref&&el.files&&el.files[0]){var mid=el.dataset.cref,r=new FileReader();r.onload=function(){ui.custom[mid].ref=r.result;drawLayer();};r.readAsDataURL(el.files[0]);}
  if(el.dataset.sup&&el.files&&el.files[0]){var f=el.files[0];if(el.dataset.sup==='video'){ui.video=URL.createObjectURL(f);ui.videoName=f.name;ui.pv=S.studio.seq.indexOf('meet');rerender();toast('Video added · shown on your “Meet” slide');}else{var r2=new FileReader();r2.onload=function(){S.studio.portrait=r2.result;if(String(r2.result).length>1500000)toast('Photo added for this session (too large to keep after reload)');else save();if(S.published)MAKERS.inez.portrait=r2.result;rerender();};r2.readAsDataURL(f);}}
});
render();
</script>

</body>
